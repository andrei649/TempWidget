name: WIP Release

# Keeps a rolling GitHub Pre-release ("wip") up to date on every push to main
# or wip/** branches (and on manual workflow_dispatch) so downloadable portable
# and MSI builds always reflect the latest revision, even during WIP work.
# The git history stays source-only; binaries live on GitHub Releases.

on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:

permissions:
  contents: write   # update the rolling wip pre-release and upload builds

concurrency:
  group: wip-release
  cancel-in-progress: true

jobs:
  wip-release:
    name: Build and publish WIP pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Official signed PawnIO 2.2.0 installer; must match DriverSetup.cs.
      PAWNIO_URL: https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe
      PAWNIO_SHA256: 1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install MSI tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wixl zip

      - name: Fetch and verify the PawnIO installer
        run: |
          curl -fsSL -o redist/PawnIO_setup.exe "$PAWNIO_URL"
          echo "$PAWNIO_SHA256  redist/PawnIO_setup.exe" | sha256sum -c -

      - name: Build portable zip and MSI
        run: |
          dotnet --version
          bash build.sh
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' TempWidget.csproj)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cp "dist/TempWidget-$VERSION-portable.zip" "dist/TempWidget-wip-portable.zip"
          cp "dist/TempWidget-$VERSION-x64.msi" "dist/TempWidget-wip-x64.msi"
          test -f "dist/TempWidget-wip-portable.zip"
          test -f "dist/TempWidget-wip-x64.msi"

      - name: Update rolling WIP pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wip"
          TITLE="TempWidget WIP (${VERSION} · ${SHORT_SHA})"
          NOTES=$(printf 'Rolling development build from branch `%s` @ commit `%s`.\n\n- **Portable:** extract `TempWidget-wip-portable.zip` and run `TempWidget.exe`.\n- **Installer:** run `TempWidget-wip-x64.msi`.\n\nUnsigned build: Windows SmartScreen may warn on first start.' "${GITHUB_REF_NAME}" "${GITHUB_SHA}")
          FILES=("dist/TempWidget-wip-portable.zip" "dist/TempWidget-wip-x64.msi")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
